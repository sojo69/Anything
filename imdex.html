<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be Honest 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #e9ddff);
      color: #4a2940;
    }
    .card {
      width: min(100%, 420px); min-height: 300px; padding: 34px 22px;
      border-radius: 28px; background: rgba(255,255,255,.84);
      box-shadow: 0 18px 55px rgba(111, 55, 100, .16);
      text-align: center; position: relative; overflow: hidden;
    }
    .heart { font-size: 48px; margin-bottom: 10px; }
    h1 { font-size: clamp(25px, 7vw, 34px); margin: 8px 0 10px; }
    p { color: #89677f; margin: 0 0 28px; }
    .buttons { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 999px; padding: 13px 27px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      touch-action: manipulation; transition: transform .15s ease;
    }
    button:active { transform: scale(.95); }
    #yes { background: #ff6b9b; color: white; }
    #no { background: #eee7f5; color: #604c69; }
    #message { min-height: 28px; margin-top: 24px; font-weight: 700; color: #d34d83; }
    .small { position: absolute; bottom: 12px; right: 16px; font-size: 10px; color: #b69aaa; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">💗</div>
    <h1 id="question">Do you hate me?</h1>
    <p id="subtitle">Be honest… choose one 👀</p>
    <div class="buttons" id="buttons">
      <button id="yes">Yes 😈</button>
      <button id="no">No 🥺</button>
    </div>
    <div id="message" aria-live="polite"></div>
    <div class="small">no button has its own plans 🙃</div>
  </main>

  <script>
    const noButton = document.getElementById('no');
    const yesButton = document.getElementById('yes');
    const card = document.querySelector('.card');
    const message = document.getElementById('message');
    let escapes = 0;

    function moveNoButton() {
      escapes++;
      const rect = card.getBoundingClientRect();
      const btn = noButton.getBoundingClientRect();
      const padding = 14;
      const maxX = Math.max(padding, rect.width - btn.width - padding);
      const maxY = Math.max(130, rect.height - btn.height - 30);
      noButton.style.position = 'absolute';
      noButton.style.left = (padding + Math.random() * (maxX - padding)) + 'px';
      noButton.style.top = (115 + Math.random() * Math.max(0, maxY - 115)) + 'px';
      message.textContent = escapes > 2 ? 'Hehe, you still can’t catch it 😂' : 'Nope! Try again 😜';
    }

    noButton.addEventListener('pointerenter', moveNoButton);
    noButton.addEventListener('click', moveNoButton);
    noButton.addEventListener('touchstart', (event) => {
      event.preventDefault();
      moveNoButton();
    }, { passive: false });

    yesButton.addEventListener('click', () => {
      document.getElementById('question').textContent = 'Oh… that’s sad 💔';
      document.getElementById('subtitle').textContent = 'I guess I got my answer.';
      message.textContent = 'Never msg me again 😭';
      document.getElementById('buttons').style.display = 'none';
      document.querySelector('.heart').textContent = '🥀';
    });
  </script>
</body>
</html>
